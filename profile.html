<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fitness Matters | My Profile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .profile-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }
    .profile-card {
      background-color: #1a2232;
      border: 1px solid #2d3748;
      border-radius: 12px;
      padding: 30px;
      margin-bottom: 25px;
    }
    .profile-header-block {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }
    .profile-avatar-large {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background-color: #ffc107;
      color: #121824;
      font-size: 2.2rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .form-group label {
      font-size: 0.85rem;
      color: #cbd5e0;
      font-weight: 600;
    }
    .form-group input, .form-group select {
      background-color: #0f172a;
      border: 1px solid #2d3748;
      color: #ffffff;
      padding: 12px 15px;
      border-radius: 6px;
      outline: none;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: #ffc107;
    }
    .btn-save {
      background-color: #ffc107;
      color: #121824;
      font-weight: 700;
      padding: 12px 25px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 20px;
    }
    .btn-save:hover {
      background-color: #e0a800;
    }
  </style>
</head>
<body>

  <!-- GLOBAL NAVBAR WITH HAMBURGER -->
  <nav class="navbar">
    <div class="nav-header">
      <button class="hamburger-btn" onclick="toggleSidebar()" aria-label="Toggle Navigation Menu">
        <i class="fa-solid fa-bars"></i>
      </button>
      <div class="brand-icon"><i class="fa-solid fa-bolt"></i></div>
      <span class="brand-name">FITNESS<span>MATTERS</span></span>
    </div>
    <div class="nav-menu">
      <a href="home.html" class="nav-item"><i class="fa-solid fa-chart-pie"></i> Overview</a>
      <a href="workouts.html" class="nav-item"><i class="fa-solid fa-dumbbell"></i> Workouts</a>
      <a href="nutrition.html" class="nav-item"><i class="fa-solid fa-utensils"></i> Nutrition</a>
      <a href="goals.html" class="nav-item"><i class="fa-solid fa-bullseye"></i> Goals</a>
      <a href="about.html" class="nav-item"><i class="fa-solid fa-circle-info"></i> About</a>
      <a href="contact.html" class="nav-item"><i class="fa-solid fa-envelope"></i> Contact</a>
    </div>
  </nav>

  <!-- SIDEBAR DRAWER -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h3>User Menu</h3>
      <button class="close-btn" onclick="toggleSidebar()">&times;</button>
    </div>
    <div class="user-card">
      <div class="avatar" id="avatar-initial">A</div>
      <div class="user-info">
        <h4 id="menu-display-name">Aditya</h4>
        <span class="badge" style="color:#ffc107;">Pro Member</span>
      </div>
    </div>
    <div class="sidebar-menu">
      <a href="profile.html" class="sidebar-item active"><i class="fa-solid fa-user"></i> My Profile</a>
      <a href="settings.html" class="sidebar-item"><i class="fa-solid fa-gear"></i> Account Settings</a>
      <a href="notifications.html" class="sidebar-item"><i class="fa-solid fa-bell"></i> Notifications</a>
      <a href="#" id="logout-btn" class="sidebar-item logout-link"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </div>
  </aside>

  <!-- MAIN MAIN CONTENT -->
  <main class="profile-container">
    <div class="page-header" style="text-align: left; margin-bottom: 25px;">
      <h1 style="color: #ffc107;">My Fitness Profile</h1>
      <p style="color: #a0aec0;">Manage your biometrics, personal details, and targets</p>
    </div>

    <form id="profile-form">
      <!-- PERSONAL DETAILS CARD -->
      <div class="profile-card">
        <div class="profile-header-block">
          <div class="profile-avatar-large" id="profile-avatar">A</div>
          <div>
            <h2 id="profile-name-text" style="font-size: 1.5rem;">Aditya</h2>
            <p style="color: #a0aec0; font-size: 0.9rem;" id="profile-phone">+91 0000000000</p>
          </div>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label for="fullname-input">Full Name</label>
            <input type="text" id="fullname-input" value="Aditya" required>
          </div>
          <div class="form-group">
            <label for="age-input">Age</label>
            <input type="number" id="age-input" value="24" min="10" max="100">
          </div>
          <div class="form-group">
            <label for="gender-select">Gender</label>
            <select id="gender-select">
              <option value="Male" selected>Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>
      </div>

      <!-- BIOMETRICS CARD -->
      <div class="profile-card">
        <h3 style="margin-bottom: 20px; color: #ffc107;">Body Metrics & Goals</h3>
        <div class="form-grid">
          <div class="form-group">
            <label for="height-input">Height (cm)</label>
            <input type="number" id="height-input" value="175">
          </div>
          <div class="form-group">
            <label for="weight-input">Current Weight (kg)</label>
            <input type="number" id="weight-input" value="72">
          </div>
          <div class="form-group">
            <label for="target-weight-input">Target Weight (kg)</label>
            <input type="number" id="target-weight-input" value="68">
          </div>
          <div class="form-group">
            <label for="activity-level">Activity Level</label>
            <select id="activity-level">
              <option value="Lightly Active">Lightly Active (1-2 days/wk)</option>
              <option value="Moderately Active" selected>Moderately Active (3-5 days/wk)</option>
              <option value="Very Active">Very Active (6-7 days/wk)</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn-save">Save Profile Changes</button>
      </div>
    </form>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="auth.js"></script>
  <script>
    // Load local stored profile state
    document.addEventListener('DOMContentLoaded', () => {
      const storedProfile = JSON.parse(localStorage.getItem('user_profile') || '{}');
      if (storedProfile.phoneNumber) {
        document.getElementById('profile-phone').innerText = storedProfile.phoneNumber;
      }
      if (storedProfile.fullname) {
        document.getElementById('fullname-input').value = storedProfile.fullname;
        document.getElementById('profile-name-text').innerText = storedProfile.fullname;
        document.getElementById('menu-display-name').innerText = storedProfile.fullname;
        document.getElementById('profile-avatar').innerText = storedProfile.fullname.charAt(0).toUpperCase();
        document.getElementById('avatar-initial').innerText = storedProfile.fullname.charAt(0).toUpperCase();
      }
    });

    // Save profile submit
    document.getElementById('profile-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const updatedProfile = {
        fullname: document.getElementById('fullname-input').value.trim(),
        age: document.getElementById('age-input').value,
        gender: document.getElementById('gender-select').value,
        height: document.getElementById('height-input').value,
        weight: document.getElementById('weight-input').value,
        targetWeight: document.getElementById('target-weight-input').value,
        activityLevel: document.getElementById('activity-level').value,
        phoneNumber: document.getElementById('profile-phone').innerText
      };

      localStorage.setItem('user_profile', JSON.stringify(updatedProfile));
      alert('Profile updated successfully!');
      location.reload();
    });
  </script>
</body>
</html>
