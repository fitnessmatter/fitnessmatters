<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Matters | Contact Us</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            background-color: #121212 !important;
            color: #ffffff !important;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            padding-bottom: 4rem;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 3rem;
            background: #121212 !important;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            background: #ffffff;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000000;
            font-size: 1rem;
        }

        .brand-name {
            font-weight: 800;
            letter-spacing: 0.5px;
            font-size: 1.15rem;
            color: #ffffff;
        }

        .brand-name span {
            color: #f59e0b;
            margin-left: 0.35rem;
        }

        .nav-menu {
            display: flex;
            gap: 2.5rem;
        }

        .nav-item {
            color: #888888;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
        }

        .nav-item:hover, .nav-item.active { color: #ffffff; }

        .user-profile-nav {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .avatar {
            width: 34px;
            height: 34px;
            background: #222222;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #ffffff;
            font-size: 0.9rem;
        }

        .logout-btn {
            background: #111111;
            border: 1px solid #333333;
            color: #ffffff;
            width: 38px;
            height: 38px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .logout-btn:hover {
            background: #ffffff;
            color: #000000;
        }

        .dashboard-wrapper {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .page-header {
            text-align: center;
            margin: 3rem 0 3rem;
        }

        .page-header h1 {
            font-size: 2.4rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }

        .page-header p {
            color: #a0a0a0;
            font-size: 1rem;
        }

        .contact-layout {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 2rem;
        }

        .info-card {
            background: #1e1e24;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .info-item {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
        }

        .info-icon {
            width: 42px;
            height: 42px;
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .info-text h4 {
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.2rem;
        }

        .info-text p {
            color: #a0a0a0;
            font-size: 0.85rem;
        }

        .form-card {
            background: #1e1e24;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 2rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .form-input, .form-textarea {
            width: 100%;
            background: #121212;
            border: 1px solid #333333;
            border-radius: 8px;
            padding: 0.8rem 1rem;
            color: #ffffff;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus, .form-textarea:focus {
            border-color: #f59e0b;
        }

        .form-textarea {
            resize: vertical;
            min-height: 120px;
        }

        .submit-btn {
            width: 100%;
            background: #f59e0b;
            color: #000000;
            border: none;
            padding: 0.9rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background: #d97706;
        }

        @media (max-width: 768px) {
            .contact-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">
            <div class="brand-icon"><i class="fa-solid fa-bolt"></i></div>
            <span class="brand-name">FITNESS<span>MATTERS</span></span>
        </div>

        <div class="nav-menu">
            <a href="home.html" class="nav-item"><i class="fa-solid fa-chart-pie"></i> Overview</a>
            <a href="workouts.html" class="nav-item"><i class="fa-solid fa-dumbbell"></i> Workouts</a>
            <a href="nutrition.html" class="nav-item"><i class="fa-solid fa-utensils"></i> Nutrition</a>
            <a href="goals.html" class="nav-item"><i class="fa-solid fa-bullseye"></i> Goals</a>
            <a href="about.html" class="nav-item"><i class="fa-solid fa-circle-info"></i> About</a>
            <a href="contact.html" class="nav-item active"><i class="fa-solid fa-envelope"></i> Contact</a>
        </div>

        <div class="user-profile-nav">
            <div class="avatar">A</div>
            <button id="logoutBtn" class="logout-btn" onclick="window.location.href='index.html'"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
    </nav>

    <main class="dashboard-wrapper">
        <div class="page-header">
            <h1>Get In Touch</h1>
            <p>Have questions or need assistance? Send us a message.</p>
        </div>

        <div class="contact-layout">
            <div class="info-card">
                <div class="info-item">
                    <div class="info-icon"><i class="fa-solid fa-location-dot"></i></div>
                    <div class="info-text">
                        <h4>Our Location</h4>
                        <p>100 Fitness Way, Performance Suite 400</p>
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-icon"><i class="fa-solid fa-envelope"></i></div>
                    <div class="info-text">
                        <h4>Email Us</h4>
                        <p>support@fitnessmatters.com</p>
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-icon"><i class="fa-solid fa-phone"></i></div>
                    <div class="info-text">
                        <h4>Call Us</h4>
                        <p>+1 (800) 555-3488</p>
                    </div>
                </div>
            </div>

            <div class="form-card">
                <form action="#" method="POST" onsubmit="event.preventDefault(); alert('Message sent successfully!');">
                    <div class="form-group">
                        <label for="name">Your Name</label>
                        <input type="text" id="name" class="form-input" placeholder="Enter your full name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" class="form-input" placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" class="form-textarea" placeholder="How can we help you?" required></textarea>
                    </div>

                    <button type="submit" class="submit-btn">Send Message</button>
                </form>
            </div>
        </div>
    </main>

</body>
</html>
